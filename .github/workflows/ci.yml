name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODEL_PROVIDER: openai
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen --python 3.11
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
      - name: Replay evals
        run: uv run python -m agentdesk.evals
