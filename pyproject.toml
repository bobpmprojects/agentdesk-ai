[project]
name = "agentdesk-ai"
version = "0.1.0"
description = "Autonomous multi-agent customer service within policy guardrails"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain-anthropic>=1.7.7",
    "langchain-aws>=1.9.1",
    "langchain-core>=1.7.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "streamlit>=1.40,<2",
]

[project.scripts]
agentdesk-seed = "agentdesk.db.seed:main"
agentdesk-m0-demo = "agentdesk.demo:main"
agentdesk-demo = "agentdesk.scenarios:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
